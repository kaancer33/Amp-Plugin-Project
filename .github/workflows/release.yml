name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # CMakeLists.txt fetches the pinned JUCE release itself (FORGE_JUCE_TAG).
      - name: Configure
        run: cmake -B build -DFORGE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --target ForgeAmp_VST3 ForgeAmp_Standalone

      - name: Package
        shell: pwsh
        run: |
          $staging = "Forge-Amp-${{ github.ref_name }}-win64"
          New-Item -ItemType Directory $staging | Out-Null
          Copy-Item -Recurse "build/ForgeAmp_artefacts/Release/VST3/Forge Amp.vst3" "$staging/"
          Copy-Item "build/ForgeAmp_artefacts/Release/Standalone/Forge Amp.exe" "$staging/"
          Copy-Item README.md, LICENSE "$staging/"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Forge Amp ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: Forge-Amp-*.zip
          body: |
            **Forge Amp**: a tube guitar amp simulator with a black-and-white, early-2000s pixel-art interface.

            ![Forge Amp](https://github.com/kaancer33/Amp-Plugin-Project/raw/main/docs/screenshot-amp.png)

            ## Contents (Windows x64)
            - **Forge Amp.vst3**: copy the whole `.vst3` folder to `C:\Program Files\Common Files\VST3`, then rescan plugins in your DAW
            - **Forge Amp.exe**: standalone app, no DAW required

            ## Highlights
            - Three voices modelled on the Fender Twin Reverb, Marshall JCM800 and Soldano SLO-100, with circuit-accurate tone stacks
            - 4x-oversampled tube preamp stages and a power amp with presence, depth and sag
            - Noise gate, TS808-style boost, speaker cabinets with IR loading, tempo-synced delay and an FDN reverb
            - 1-bit pixel UI with bitmap fonts and dithering, crisp at 1x to 4x zoom
            - 10 factory presets plus user presets

            ## Notes
            - Forge Amp is a separate plugin from FruGuitar Audio: it does not load `.nam` models, and DAW sessions keep using whichever plugin they were saved with
            - The binaries are unsigned, so Windows SmartScreen may warn the first time you run the standalone app

      - name: Upload build artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Amp-win64
          path: Forge-Amp-*.zip

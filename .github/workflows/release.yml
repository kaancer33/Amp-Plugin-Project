name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git "${{ runner.temp }}\JUCE"

      - name: Configure
        run: cmake -B build -DJUCE_PATH="${{ runner.temp }}\JUCE"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $staging = "FruGuitar-Audio-${{ github.ref_name }}-win64"
          New-Item -ItemType Directory $staging | Out-Null
          Copy-Item -Recurse "build/NewProject_artefacts/Release/VST3/FruGuitar Audio.vst3" "$staging/"
          Copy-Item "build/NewProject_artefacts/Release/Standalone/FruGuitar Audio.exe" "$staging/"
          Copy-Item README.md, LICENSE "$staging/"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FruGuitar Audio ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: FruGuitar-Audio-*.zip
          body: |
            The first public beta of **FruGuitar Audio** — a neural guitar amp sim (Neural Amp Modeler) with a pixel-art Frutiger Aero UI. 🎸

            ![Pixel Aero UI](https://github.com/kaancer33/Amp-Plugin-Project/raw/main/docs/screenshot.png)

            ## Contents (Windows x64)
            - **FruGuitar Audio.vst3** — copy the whole `.vst3` folder to `C:\Program Files\Common Files\VST3`, then rescan plugins in your DAW
            - **FruGuitar Audio.exe** — standalone app, no DAW required

            ## Highlights
            - Neural Amp Modeler engine: loads WaveNet / LSTM / ConvNet `.nam` captures — pick from the model bar or drag & drop a file onto the window
            - Full chain: noise gate → NAM inference → 3-band tone stack → 4x12 cabinet sim → delay → reverb
            - Pixel Aero UI: dithered skies, frosted-glass panels, glossy aqua orb knobs, three window sizes (S/M/L)
            - Preset system with save / rename / delete
            - Fixed: NAM models failing to load in plugin builds (empty architecture registry)

            ## Beta notes
            - Windows 64-bit only for now; macOS/Linux builds are untested
            - The plugin ID changed with the FruGuitar Audio rename — DAW sessions that used old `NewProject` builds need the plugin re-added
            - Model library: `%APPDATA%\FruGuitar Audio\Models` (an existing `NewProject` library migrates automatically)

      - name: Upload build artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: FruGuitar-Audio-win64
          path: FruGuitar-Audio-*.zip
